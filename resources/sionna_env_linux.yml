# Entorno Conda/Mamba optimizado para Linux (gui.py y main.ipynb)
# Uso: mamba env create -f resources/sionna_env_linux.yml
name: sionna
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26,<2.0
  - pandas>=2.0,<3.0
  - matplotlib>=3.8
  - psutil>=5.9
  - pyqt6>=6.6
  - ipykernel
  - jupyterlab
  - pip:
      - tensorflow[and-cuda]==2.19.1
      - sionna==1.2.2
